    <p>이 도구는 브라우저에서 동작하는 이미지 처리 도구로, JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 활성화한 뒤 페이지를 새로고침해 주세요.</p>
    <h2>이 도구로 할 수 있는 작업</h2>
    <ul>
      <li><strong>이미지 자르기</strong> — 스프라이트 시트 이미지를 가로×세로 격자로 잘라 프레임 PNG로 저장합니다.</li>
      <li><strong>GIF 스프라이트 분할</strong> — GIF 애니메이션의 모든 프레임을 개별 PNG 또는 하나의 스프라이트 시트로 변환합니다.</li>
      <li><strong>다중 이미지 일괄 자르기</strong> — 여러 사진을 고정한 크기로 가운데 정렬 자르고 PNG로 묶어 ZIP으로 저장합니다.</li>
    </ul>
