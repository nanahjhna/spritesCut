<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI가 생성한 스프라이트 시트를 프레임 단위로 잘라 ZIP으로 다운로드하는 도구">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="스프라이트 분할">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AI 스프라이트 시트 분할 도구</title>
  <link rel="manifest" href="manifest.json">

  <!-- imgly Background Removal (ESM CDN - <script type="module"> 필수) -->
  <script type="module">
    import { removeBackground } from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm';

    // Flutter(Dart)의 window.removeAiBg(dataUrl) 호출에 대응하는 브릿지
    window.removeAiBg = async function (dataUrl) {
      if (typeof removeBackground !== 'function') {
        throw new Error('AI 라이브러리가 로드되지 않았습니다.');
      }
      try {
        const blob = await removeBackground(dataUrl, {
          model: 'small', // small(~40MB) / medium(~80MB) — 크기·속도 대비 품질 조절
          output: { format: 'image/png' },
        });

        // Blob을 ArrayBuffer로 변환하여 Dart로 전달
        const arrayBuffer = await blob.arrayBuffer();
        return new Uint8Array(arrayBuffer);
      } catch (err) {
        const message = err && err.message ? err.message : String(err);
        console.error('AI BG Removal Error:', message);
        throw new Error(message);
      }
    };
  </script>
</head>
<body>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
